<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfcfd">
  <meta name="description" content="Confirmação de presença no jantar de celebração dos 50 anos de Armando Jomboce.">
  <title>Confirmar Presença | Armando Jomboce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="confirm-page-light">
  <header class="confirm-light-topbar">
    <a class="back-link-dark" href="/">
      <span aria-hidden="true">←</span> Voltar ao convite
    </a>
    <a class="brand-light" href="/" aria-label="Convite Armando Jomboce">
      <span class="brand-mark-dark">50</span>
      <span>ARMANDO JOMBOCE</span>
    </a>
    <a class="admin-link-dark" href="/admin.html">Área reservada <span aria-hidden="true">↗</span></a>
  </header>

  <main class="rsvp-page-container">
    <section class="rsvp-card" id="confirmar">
      <p class="eyebrow dark-eyebrow">Será um prazer contar consigo</p>
      <h2>Confirme a sua<br>presença</h2>
      <p class="rsvp-copy">Para nos ajudar a organizar melhor o jantar, por favor, indique o seu nome completo.</p>

      <form id="rsvp-form" class="rsvp-form">
        <label class="sr-only" for="guest-name">O seu nome completo</label>
        <div class="input-wrap">
          <span aria-hidden="true">♙</span>
          <input id="guest-name" name="name" type="text" maxlength="100" autocomplete="name" placeholder="O seu nome completo" required autofocus>
        </div>
        <input class="hp-field" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="primary-button" type="submit"><span aria-hidden="true">✓</span> Confirmar presença</button>
        <p id="rsvp-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </form>

      <p class="thanks-note">Obrigado por fazer parte deste momento.</p>
      <span class="small-gold-line"></span>
    </section>
  </main>

  <footer class="site-footer">
    <span class="footer-age">50</span>
    <span>ARMANDO JOMBOCE · 27.12.2026</span>
  </footer>

  <script src="/confirmar.js"></script>
</body>
</html>
